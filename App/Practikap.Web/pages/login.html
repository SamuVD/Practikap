<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Practikap</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/practikap.css">
</head>

<body>
    <!--
        Unica pagina sin barra de navegacion y sin guarda de sesion: es el
        destino al que la guarda manda, no una pantalla protegida.

        El formulario lleva novalidate a proposito. La validacion de forma es
        del servidor, y un correo vacio tiene que llegar a la API para que
        responda 400 con Detalles poblado: si el navegador lo atajara antes, la
        comprobacion 3 de la ronda no podria observarse.
    -->
    <main class="pk-acceso">
        <div class="card pk-acceso-tarjeta">
            <div class="card-header pk-acceso-cabecera">
                <h1>Practikap</h1>
                <p>Gestión de prácticas productivas</p>
            </div>

            <div class="card-body">
                <div id="pk-aviso" class="alert d-none" role="status"></div>
                <div id="pk-banda" class="alert d-none" role="alert"></div>

                <form id="pk-formulario" novalidate>
                    <div class="mb-3">
                        <label for="pk-correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="pk-correo"
                               name="Correo" autocomplete="username" autofocus>
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="pk-contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="pk-contrasena"
                               name="Contrasena" autocomplete="current-password">
                        <div class="invalid-feedback"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" id="pk-entrar">
                        Entrar
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pagina-login.js"></script>
</body>

</html>
