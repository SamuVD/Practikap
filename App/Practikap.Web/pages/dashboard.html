<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero · Practikap</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/practikap.css">
</head>

<body>
    <!--
        Armazon de la Ronda 1: barra superior, barra lateral por rol, saludo y
        tarjetas de acceso. Sin indicadores.

        Los indicadores del tablero consumen practicas y notificaciones, que son
        de las Rondas 2 y 3, y se llenan alli. Esta pagina no dispara ninguna
        peticion: todo lo que muestra sale de la sesion ya guardada.
    -->
    <div id="pk-nav"></div>

    <main class="pk-contenido">
        <div id="pk-aviso" class="alert d-none" role="status"></div>

        <h1 class="pk-titulo" id="pk-saludo"></h1>
        <p class="text-body-secondary" id="pk-subtitulo"></p>

        <h2 class="h5 mt-4 mb-3">Accesos</h2>
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="pk-accesos"></div>

        <p class="text-body-secondary small mt-4">
            Los indicadores del tablero se incorporan en rondas posteriores, junto
            con las pantallas de prácticas y notificaciones de las que se calculan.
        </p>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/pagina-dashboard.js"></script>
</body>

</html>
