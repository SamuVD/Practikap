<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil · Practikap</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/practikap.css">
</head>

<body>
    <!--
        Accesible a los tres roles, pero siempre sobre la cuenta propia: el id
        sale de usuario.id de la sesion y nunca de la barra de direcciones. Un
        Instructor o un Aprendiz consultando una cuenta ajena recibe 403.

        El rol se muestra deshabilitado (Doc_Wireframes 4.2): nadie cambia su
        propio rol, y el Administrador que quiera cambiar el de otro lo hace
        desde gestion-usuarios.html.
    -->
    <div id="pk-nav"></div>

    <main class="pk-contenido">
        <h1 class="pk-titulo">Mi perfil</h1>

        <div class="row g-4">
            <div class="col-12 col-xl-6">
                <div class="card h-100">
                    <div class="card-header">Datos personales</div>
                    <div class="card-body">
                        <div id="pk-banda-perfil" class="alert d-none" role="alert"></div>

                        <form id="pk-formulario-perfil" novalidate>
                            <div class="mb-3">
                                <label for="pk-correo" class="form-label">Correo</label>
                                <input type="email" class="form-control" id="pk-correo" disabled>
                                <div class="form-text">
                                    El correo identifica la cuenta y no se edita.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="pk-rol" class="form-label">Rol</label>
                                <input type="text" class="form-control" id="pk-rol" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="pk-estado" class="form-label">Estado</label>
                                <input type="text" class="form-control" id="pk-estado" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="pk-nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="pk-nombre"
                                       name="Nombre" autocomplete="given-name">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="pk-apellido" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="pk-apellido"
                                       name="Apellido" autocomplete="family-name">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="pk-telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="pk-telefono"
                                       name="Telefono" autocomplete="tel">
                                <div class="invalid-feedback"></div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="pk-guardar-perfil">
                                Guardar cambios
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-6">
                <div class="card h-100">
                    <div class="card-header">Cambiar contraseña</div>
                    <div class="card-body">
                        <div id="pk-banda-clave" class="alert d-none" role="alert"></div>

                        <p class="text-body-secondary small">
                            Al cambiar la contraseña se cierra la sesión en curso y hay
                            que volver a entrar con la nueva.
                        </p>

                        <form id="pk-formulario-clave" novalidate>
                            <div class="mb-3">
                                <label for="pk-clave-actual" class="form-label">
                                    Contraseña actual
                                </label>
                                <input type="password" class="form-control" id="pk-clave-actual"
                                       name="ContrasenaActual" autocomplete="current-password">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="pk-clave-nueva" class="form-label">
                                    Contraseña nueva
                                </label>
                                <input type="password" class="form-control" id="pk-clave-nueva"
                                       name="ContrasenaNueva" autocomplete="new-password">
                                <div class="form-text">
                                    Entre 8 y 72 caracteres, con al menos una letra y un
                                    dígito, y distinta de la actual.
                                </div>
                                <div class="invalid-feedback"></div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="pk-guardar-clave">
                                Cambiar contraseña
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/pagina-mi-perfil.js"></script>
</body>

</html>
